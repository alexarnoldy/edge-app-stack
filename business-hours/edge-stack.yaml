apiVersion: v1
kind: Namespace
metadata:
  name: lenovo-edge-business-hours
  
---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: lenovo-edge-sa
  namespace: lenovo-edge-business-hours
automountServiceAccountToken: false

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: lenovo-edge-business-hours
  name: lenovo-edge-role
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
  
---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lenovo-edge-rb
  namespace: lenovo-edge-business-hours
subjects:
- kind: ServiceAccount
  name: lenovo-edge-sa
  apiGroup: ""
roleRef:
  kind: Role 
  name: lenovo-edge-role
  apiGroup: rbac.authorization.k8s.io
  
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-app-1 
  namespace: lenovo-edge-business-hours
spec:
  replicas: 3
  selector:
    matchLabels:
      app: business-app-1
  template:
    metadata:
      labels:
        app: business-app-1
    spec:
      containers:
      - name: nginx
        image: katacoda/docker-http-server:latest
        ports:
        - containerPort: 80
        
---

apiVersion: v1
kind: Service
metadata:
  name: business-app-1-service
  namespace: lenovo-edge-business-hours
spec:
  type: NodePort
  selector:
    app: business-app-1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30004
        
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-app-2
  namespace: lenovo-edge-business-hours
spec:
  replicas: 3
  selector:
    matchLabels:
      app: business-app-2
  template:
    metadata:
      labels:
        app: business-app-2
    spec:
      containers:
      - name: nginx
        image: katacoda/docker-http-server:latest
#       image: registry.susealliances.com/docker-http-server:latest
        ports:
        - containerPort: 80
        
---

apiVersion: v1
kind: Service
metadata:
  name: business-app-2-service
  namespace: lenovo-edge-business-hours
spec:
  type: NodePort
  selector:
    app: business-app-2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30005

---          
